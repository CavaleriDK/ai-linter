name: AI Linter

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pull_request-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  ai-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Change DNS to Cloudflare
        run: |
          sudo sed -i 's/nameserver.*/nameserver 1.1.1.1/' /etc/resolv.conf
          echo "nameserver 1.1.1.2" | sudo tee -a /etc/resolv.conf
          cat /etc/resolv.conf

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install AI Linter
        run: |-
          npm install
          npm install -g

      - name: Install Codex
        run: |
          cd $(npm root -g)/ai-linter-cli
          npm run install:codex

      - name: Generate GitHub App Token
        id: generate_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.AI_LINTER_APP_ID }}
          private-key: ${{ secrets.AI_LINTER_PRIVATE_KEY }}

      - name: Run AI Linter
        env:
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}
          AI_LINTER_OPENAI_KEY: ${{ secrets.AI_LINTER_OPENAI_KEY }}
        working-directory: ${{ github.workspace }}
        run: |
          ai-linter \
            --repo-owner ${{ github.repository_owner }} \
            --repo-name ${{ github.event.repository.name }} \
            --pr ${{ github.event.pull_request.number }} \
            --base=${{ github.base_ref }} \
            --head=${{ github.head_ref }} 